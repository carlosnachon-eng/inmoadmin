name: Respond inventory regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inventory security and compatibility
        run: node --test tests/respondInventoryCommercial.test.mjs tests/respondInventoryControl.test.mjs tests/respondInventoryPilot.test.mjs tests/respondInventoryPrivacy.test.mjs
